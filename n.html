<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的在线书店</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        header { text-align: center; background: #2c3e50; color: white; padding: 30px; border-radius: 8px; }
        .container { max-width: 800px; margin: 30px auto; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .book-card { background: white; width: 230px; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .book-title { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .book-desc { font-size: 14px; color: #666; margin-bottom: 15px; }
        .book-price { font-size: 16px; color: #e74c3c; font-weight: bold; margin-bottom: 15px; }
        .buy-btn { background: #27ae60; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .buy-btn:hover { background: #219653; }
    </style>
</head>
<body>

    <header>
        <h1>📚 欢迎来到我的在线书店</h1>
        <p>精选好书，伴你成长</p>
    </header>

    <div class="container">
        {% for book in books %}
        <div class="book-card">
            <div>
                <div class="book-title">{{ book.title }}</div>
                <div class="book-desc">{{ book.desc }}</div>
            </div>
            <div>
                <div class="book-price">{{ book.price }}</div>
                <button class="buy-btn" onclick="alert('感谢购买《{{ book.title }}》！(演示版)')">立即购买</button>
            </div>
        </div>
        {% endfor %}
    </div>

</body>
</html>
